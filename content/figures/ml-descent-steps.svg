<svg class="ml-diagram" viewBox="0 0 320 345" role="img" aria-labelledby="ml-descent-steps-title ml-descent-steps-desc" xmlns="http://www.w3.org/2000/svg"><title id="ml-descent-steps-title">A large learning rate can diverge</title><desc id="ml-descent-steps-desc">Computed iterations from u0=1: learning rate 0.5 halves the parameter at each step, while learning rate 2.2 alternates sign and multiplies its magnitude by 1.2.</desc><defs><marker id="ml-descent-steps-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" class="ml-arrowhead"/></marker></defs><text class="ml-small" x="44" y="52" text-anchor="start">Parameter uₖ</text><line class="ml-grid" x1="44" y1="67" x2="44" y2="252" /><text class="ml-small" x="44" y="274" text-anchor="middle">0</text><line class="ml-grid" x1="120.667" y1="67" x2="120.667" y2="252" /><text class="ml-small" x="120.667" y="274" text-anchor="middle">2</text><line class="ml-grid" x1="197.333" y1="67" x2="197.333" y2="252" /><text class="ml-small" x="197.333" y="274" text-anchor="middle">4</text><line class="ml-grid" x1="274" y1="67" x2="274" y2="252" /><text class="ml-small" x="274" y="274" text-anchor="middle">6</text><line class="ml-grid" x1="44" y1="246.219" x2="274" y2="246.219" /><text class="ml-small" x="34" y="251.219" text-anchor="end">-3</text><line class="ml-grid" x1="44" y1="159.5" x2="274" y2="159.5" /><text class="ml-small" x="34" y="164.5" text-anchor="end">0</text><line class="ml-grid" x1="44" y1="72.7812" x2="274" y2="72.7812" /><text class="ml-small" x="34" y="77.7812" text-anchor="end">3</text><line class="ml-axis" x1="44" y1="252" x2="274" y2="252" /><line class="ml-axis" x1="44" y1="67" x2="44" y2="252" /><text class="ml-small" x="159" y="300" text-anchor="middle">Iteration k</text><path class="ml-curve" d="M44.00,130.59 L82.33,145.05 L120.67,152.27 L159.00,155.89 L197.33,157.69 L235.67,158.60 L274.00,159.05" /><circle class="ml-dot" cx="44" cy="130.594" r="3"/><circle class="ml-dot" cx="82.3333" cy="145.047" r="3"/><circle class="ml-dot" cx="120.667" cy="152.273" r="3"/><circle class="ml-dot" cx="159" cy="155.887" r="3"/><circle class="ml-dot" cx="197.333" cy="157.693" r="3"/><circle class="ml-dot" cx="235.667" cy="158.597" r="3"/><circle class="ml-dot" cx="274" cy="159.048" r="3"/><path class="ml-secondary ml-dashed" d="M44.00,130.59 L82.33,194.19 L120.67,117.87 L159.00,209.45 L197.33,99.56 L235.67,231.43 L274.00,73.19" /><circle class="ml-ring" cx="44" cy="130.594" r="3"/><circle class="ml-ring" cx="82.3333" cy="194.188" r="3"/><circle class="ml-ring" cx="120.667" cy="117.875" r="3"/><circle class="ml-ring" cx="159" cy="209.45" r="3"/><circle class="ml-ring" cx="197.333" cy="99.56" r="3"/><circle class="ml-ring" cx="235.667" cy="231.428" r="3"/><circle class="ml-ring" cx="274" cy="73.1864" r="3"/><text class="ml-label" x="160" y="23" text-anchor="middle">Choose a step size</text><line class="ml-curve" x1="46" y1="320" x2="69" y2="320" /><text class="ml-small" x="78" y="325" text-anchor="start">η = 0.5</text><line class="ml-secondary ml-dashed" x1="170" y1="320" x2="193" y2="320" /><text class="ml-small" x="202" y="325" text-anchor="start">η = 2.2</text></svg>
