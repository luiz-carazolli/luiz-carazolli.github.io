<svg class="ml-diagram" viewBox="0 0 420 515" role="img" aria-labelledby="ml-network-title ml-network-desc" xmlns="http://www.w3.org/2000/svg"><title id="ml-network-title">A network with nine parameters</title><desc id="ml-network-desc">Two inputs connect through four weights to two tanh hidden units. Two output weights combine those units, and a sigmoid produces a success probability. Each hidden unit and the output have a bias.</desc><defs><marker id="ml-network-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" class="ml-arrowhead"/></marker></defs><text class="ml-kicker" x="210" y="24" text-anchor="middle">STANDARDIZED INPUTS</text><line class="ml-edge" x1="95" y1="105" x2="95" y2="215" marker-end="url(#ml-network-arrow)"/><line class="ml-edge" x1="95" y1="105" x2="325" y2="215" marker-end="url(#ml-network-arrow)"/><line class="ml-edge" x1="325" y1="105" x2="95" y2="215" marker-end="url(#ml-network-arrow)"/><line class="ml-edge" x1="325" y1="105" x2="325" y2="215" marker-end="url(#ml-network-arrow)"/><line class="ml-edge" x1="95" y1="275" x2="190" y2="380" marker-end="url(#ml-network-arrow)"/><line class="ml-edge" x1="325" y1="275" x2="230" y2="380" marker-end="url(#ml-network-arrow)"/><circle class="ml-node" cx="95" cy="80" r="26"/><text class="ml-label" x="95" y="86" text-anchor="middle">x₁</text><text class="ml-small" x="95" y="42" text-anchor="middle">Length</text><circle class="ml-node" cx="325" cy="80" r="26"/><text class="ml-label" x="325" y="86" text-anchor="middle">x₂</text><text class="ml-small" x="325" y="42" text-anchor="middle">Gradient</text><circle class="ml-node" cx="95" cy="245" r="31"/><text class="ml-label" x="95" y="250" text-anchor="middle">z₁</text><text class="ml-small" x="77" y="299" text-anchor="middle">tanh · bias b₁</text><circle class="ml-node" cx="325" cy="245" r="31"/><text class="ml-label" x="325" y="250" text-anchor="middle">z₂</text><text class="ml-small" x="343" y="299" text-anchor="middle">tanh · bias b₂</text><text class="ml-accent-label" x="56" y="174" text-anchor="middle">w₁₁</text><text class="ml-accent-label" x="365" y="174" text-anchor="middle">w₂₂</text><text class="ml-accent-label" x="150" y="120" text-anchor="middle">w₂₁</text><text class="ml-accent-label" x="270" y="120" text-anchor="middle">w₁₂</text><text class="ml-accent-label" x="123" y="355" text-anchor="middle">v₁</text><text class="ml-accent-label" x="296" y="355" text-anchor="middle">v₂</text><circle class="ml-node" cx="210" cy="410" r="35"/><text class="ml-label" x="210" y="416" text-anchor="middle">σ</text><text class="ml-label" x="210" y="468" text-anchor="middle">p<tspan baseline-shift="sub" font-size="12">θ</tspan>(x) · success probability</text><text class="ml-small" x="210" y="494" text-anchor="middle">Output bias c</text></svg>
