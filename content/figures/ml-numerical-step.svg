<svg class="ml-diagram" viewBox="0 0 440 305" role="img" aria-labelledby="ml-numerical-step-title ml-numerical-step-desc" xmlns="http://www.w3.org/2000/svg"><title id="ml-numerical-step-title">One gradient step reduces the example loss</title><desc id="ml-numerical-step-desc">The probability increases from 0.7159 to 0.7443 and the cross-entropy decreases from 0.3342 to 0.2954 after one simultaneous parameter update with learning rate 0.1.</desc><defs><marker id="ml-numerical-step-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" class="ml-arrowhead"/></marker></defs><text class="ml-kicker" x="220" y="27" text-anchor="middle">ONE SUCCESSFUL ATTEMPT</text><rect class="ml-card" x="21" y="55" width="182" height="190" rx="3"/><text class="ml-small" x="112" y="86" text-anchor="middle">Before</text><text class="ml-number" x="112" y="125" text-anchor="middle">0.7159</text><text class="ml-small" x="112" y="148" text-anchor="middle">Success probability</text><text class="ml-number" x="112" y="192" text-anchor="middle">0.3342</text><text class="ml-small" x="112" y="216" text-anchor="middle">Cross-entropy</text><rect class="ml-card" x="237" y="55" width="182" height="190" rx="3"/><text class="ml-small" x="328" y="86" text-anchor="middle">After</text><text class="ml-number" x="328" y="125" text-anchor="middle">0.7443</text><text class="ml-small" x="328" y="148" text-anchor="middle">Success probability</text><text class="ml-number" x="328" y="192" text-anchor="middle">0.2954</text><text class="ml-small" x="328" y="216" text-anchor="middle">Cross-entropy</text><line class="ml-edge" x1="205" y1="151" x2="230" y2="151" marker-end="url(#ml-numerical-step-arrow)"/><text class="ml-accent-label" x="220" y="280" text-anchor="middle">θ<tspan baseline-shift="sub" font-size="12">new</tspan> = θ − 0.1 ∇ℓ(θ)</text></svg>
