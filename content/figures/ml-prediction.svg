<svg class="ml-diagram" viewBox="0 0 310 495" role="img" aria-labelledby="ml-prediction-title ml-prediction-desc" xmlns="http://www.w3.org/2000/svg"><title id="ml-prediction-title">Prediction process</title><desc id="ml-prediction-desc">A new climb passes through the trained model to produce a success probability, with no parameter update.</desc><defs><marker id="ml-prediction-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" class="ml-arrowhead"/></marker></defs><text class="ml-label" x="155" y="25" text-anchor="middle">Prediction</text><rect class="ml-card" x="35" y="55" width="240" height="58" rx="3"/><text class="ml-flow-label" x="155" y="79" text-anchor="middle">New climb</text><text class="ml-small" x="155" y="99" text-anchor="middle">Input x</text><line class="ml-edge" x1="155" y1="115" x2="155" y2="132" marker-end="url(#ml-prediction-arrow)"/><rect class="ml-card" x="35" y="136" width="240" height="58" rx="3"/><text class="ml-flow-label" x="155" y="160" text-anchor="middle">Trained model</text><text class="ml-small" x="155" y="180" text-anchor="middle">Parameters held fixed</text><line class="ml-edge" x1="155" y1="196" x2="155" y2="213" marker-end="url(#ml-prediction-arrow)"/><rect class="ml-card" x="35" y="217" width="240" height="58" rx="3"/><text class="ml-flow-label" x="155" y="241" text-anchor="middle">Success probability</text><text class="ml-small" x="155" y="261" text-anchor="middle">No parameter update</text><text class="ml-label" x="155" y="368" text-anchor="middle">Use what has been learned.</text><text class="ml-small" x="155" y="393" text-anchor="middle">Keep the parameters fixed.</text></svg>
