<svg class="ml-diagram" viewBox="0 0 310 495" role="img" aria-labelledby="ml-training-title ml-training-desc" xmlns="http://www.w3.org/2000/svg"><title id="ml-training-title">Training process</title><desc id="ml-training-desc">Recorded examples drive a loop of predictions, loss, backpropagation, and parameter updates.</desc><defs><marker id="ml-training-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" class="ml-arrowhead"/></marker></defs><text class="ml-label" x="155" y="25" text-anchor="middle">Training</text><rect class="ml-card" x="35" y="55" width="240" height="58" rx="3"/><text class="ml-flow-label" x="155" y="79" text-anchor="middle">Recorded attempts</text><text class="ml-small" x="155" y="99" text-anchor="middle">Inputs x and outcomes y</text><line class="ml-edge" x1="155" y1="115" x2="155" y2="132" marker-end="url(#ml-training-arrow)"/><rect class="ml-card" x="35" y="136" width="240" height="58" rx="3"/><text class="ml-flow-label" x="155" y="160" text-anchor="middle">Model → predictions</text><text class="ml-small" x="155" y="180" text-anchor="middle">Current parameters θ</text><line class="ml-edge" x1="155" y1="196" x2="155" y2="213" marker-end="url(#ml-training-arrow)"/><rect class="ml-card" x="35" y="217" width="240" height="58" rx="3"/><text class="ml-flow-label" x="155" y="241" text-anchor="middle">Loss against outcomes</text><text class="ml-small" x="155" y="261" text-anchor="middle">Measure the discrepancy</text><line class="ml-edge" x1="155" y1="277" x2="155" y2="294" marker-end="url(#ml-training-arrow)"/><rect class="ml-card" x="35" y="298" width="240" height="58" rx="3"/><text class="ml-flow-label" x="155" y="322" text-anchor="middle">Backpropagation</text><text class="ml-small" x="155" y="342" text-anchor="middle">Compute the gradient</text><line class="ml-edge" x1="155" y1="358" x2="155" y2="375" marker-end="url(#ml-training-arrow)"/><rect class="ml-card" x="35" y="379" width="240" height="58" rx="3"/><text class="ml-flow-label" x="155" y="403" text-anchor="middle">Update parameters</text><text class="ml-small" x="155" y="423" text-anchor="middle">Gradient descent</text><path class="ml-edge" d="M275,408 L299,408 L299,165 L278,165" marker-end="url(#ml-training-arrow)"/><text class="ml-small" x="155" y="476" text-anchor="middle">Repeat with updated θ</text></svg>
