<svg class="tda-diagram " viewBox="0 0 530 525" role="img" aria-labelledby="tda-persistence-diagram.svg-title tda-persistence-diagram.svg-desc" xmlns="http://www.w3.org/2000/svg"><title id="tda-persistence-diagram.svg-title">An illustrative persistence diagram</title><desc id="tda-persistence-diagram.svg-desc">Three points have birth-death coordinates (1,3), (2,2.5), and (1.5,4). The diagonal is dashed. A vertical segment of length two marks the first point’s persistence.</desc><line class="tda-grid" x1="70.00" y1="455.00" x2="70.00" y2="45.00"/><line class="tda-grid" x1="70.00" y1="455.00" x2="480.00" y2="455.00"/><text class="tda-caption" x="70" y="477" text-anchor="middle">0</text><text class="tda-caption" x="55" y="460" text-anchor="end">0</text><line class="tda-grid" x1="152.00" y1="455.00" x2="152.00" y2="45.00"/><line class="tda-grid" x1="70.00" y1="373.00" x2="480.00" y2="373.00"/><text class="tda-caption" x="152" y="477" text-anchor="middle">1</text><text class="tda-caption" x="55" y="378" text-anchor="end">1</text><line class="tda-grid" x1="234.00" y1="455.00" x2="234.00" y2="45.00"/><line class="tda-grid" x1="70.00" y1="291.00" x2="480.00" y2="291.00"/><text class="tda-caption" x="234" y="477" text-anchor="middle">2</text><text class="tda-caption" x="55" y="296" text-anchor="end">2</text><line class="tda-grid" x1="316.00" y1="455.00" x2="316.00" y2="45.00"/><line class="tda-grid" x1="70.00" y1="209.00" x2="480.00" y2="209.00"/><text class="tda-caption" x="316" y="477" text-anchor="middle">3</text><text class="tda-caption" x="55" y="214" text-anchor="end">3</text><line class="tda-grid" x1="398.00" y1="455.00" x2="398.00" y2="45.00"/><line class="tda-grid" x1="70.00" y1="127.00" x2="480.00" y2="127.00"/><text class="tda-caption" x="398" y="477" text-anchor="middle">4</text><text class="tda-caption" x="55" y="132" text-anchor="end">4</text><line class="tda-grid" x1="480.00" y1="455.00" x2="480.00" y2="45.00"/><line class="tda-grid" x1="70.00" y1="45.00" x2="480.00" y2="45.00"/><text class="tda-caption" x="480" y="477" text-anchor="middle">5</text><text class="tda-caption" x="55" y="50" text-anchor="end">5</text><line class="tda-axis" x1="70.00" y1="455.00" x2="496.40" y2="455.00"/><line class="tda-axis" x1="70.00" y1="455.00" x2="70.00" y2="28.60"/><line class="tda-diagonal" x1="70.00" y1="455.00" x2="480.00" y2="45.00"/><text class="tda-label" x="286" y="508" text-anchor="middle">Birth</text><text class="tda-label" x="35" y="20" text-anchor="start">Death</text><text class="tda-caption" x="433" y="69" text-anchor="middle">d = b</text><line class="tda-persistence" x1="152.00" y1="373.00" x2="152.00" y2="209.00"/><text class="tda-caption" x="143" y="296" text-anchor="end">d − b = 2</text><circle class="tda-diagram-point" cx="152" cy="209" r="5"/><text class="tda-caption" x="165" y="199" text-anchor="start">(1, 3)</text><circle class="tda-diagram-point" cx="234" cy="250.0" r="5"/><text class="tda-caption" x="222" y="273.0" text-anchor="end">(2, 2.5)</text><circle class="tda-diagram-point" cx="193.0" cy="127" r="5"/><text class="tda-caption" x="206.0" y="117" text-anchor="start">(1.5, 4)</text></svg>